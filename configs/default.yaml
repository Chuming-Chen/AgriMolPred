# AgriMolPred default configuration

# ---------------- Data ----------------
data:
  path: data/processed/three_pathogens.csv
  smiles_col: smiles
  label_col: label
  split: scaffold          # scaffold split
  n_folds: 5
  val_ratio: 0.1
  random_state: 42

# ---------------- Encoders (frozen) ----------------
encoders:
  seq_1d:
    - ChemBERTa-2
    - SmolBERT
    - MolFormer
  graph_2d:
    - MolBERT
    - MolCLR
  conformer_3d:
    - Uni-Mol
  freeze: true
  embed_dim: 768

# ---------------- Fusion ----------------
fusion:
  stage1:
    n_heads: 8
    dropout: 0.1
    gate: sigmoid
  stage2:
    n_heads: 8
    gate: sigmoid

# ---------------- Capsule network ----------------
capsule:
  primary_caps: 6
  primary_caps_dim: 16
  class_caps_dim: 16
  routing_iters: 3
  n_classes: 2             # active / inactive per pathogen

# ---------------- Training ----------------
train:
  epochs: 100
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  loss: bce                # bce | focal
  patience: 20
  device: cuda

# ---------------- Interpretation ----------------
interpret:
  shap: true
  docking: true
